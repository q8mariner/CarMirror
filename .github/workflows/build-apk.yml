name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace old project with carmirror-src.txt
        run: |
          if [ ! -f carmirror-src.txt ]; then echo "No source bundle - building current project"; exit 0; fi
          git ls-files | grep -v -e '^\.github/' -e '^carmirror-src\.txt$' | xargs -r git rm -q
          python3 - <<'EOF'
          import os
          path = None
          buf = []
          def flush():
              if path:
                  os.makedirs(os.path.dirname(path) or ".", exist_ok=True)
                  with open(path, "w", encoding="utf-8") as f:
                      f.write("\n".join(buf) + "\n")
          for line in open("carmirror-src.txt", encoding="utf-8").read().split("\n"):
              if line.startswith("@@@FILE "):
                  flush()
                  path = line[8:].strip()
                  buf = []
              else:
                  buf.append(line)
          flush()
          EOF
          git rm -q carmirror-src.txt
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Replace project with new CarMirror source"
          git push
          git ls-files

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: CarMirror-apk
          path: app/build/outputs/apk/debug/app-debug.apk
